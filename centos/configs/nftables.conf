#!/usr/sbin/nft -f

# Очистить все существующие правила перед загрузкой
flush ruleset

# ============================================================
# ТАБЛИЦА NAT (только IPv4)
# ============================================================
table ip nat {
    
    # Цепочка PREROUTING - обработка пакетов ДО маршрутизации
    # Используется для DNAT (проброс портов извне внутрь)
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        
        # === ПРОБРОС ПОРТОВ ===
        # Проброс SSH: внешний порт 2222 -> внутренний сервер 192.168.1.2:22
        iifname "ens33" tcp dport 2222 dnat to 192.168.1.2:22
        
        # Пример: проброс HTTP (раскомментируйте если нужно)
        # iifname "ens33" tcp dport 80 dnat to 192.168.1.10:80
        
        # Пример: проброс диапазона портов
        # iifname "ens33" tcp dport 8080-8090 dnat to 192.168.1.10:8080-8090
        
        # Пример: проброс UDP (например, для игрового сервера)
        # iifname "ens33" udp dport 27015 dnat to 192.168.1.10:27015
    }
    
    # Цепочка POSTROUTING - обработка пакетов ПОСЛЕ маршрутизации
    # Используется для SNAT/MASQUERADE (исходящий NAT)
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        
        # Маскарадинг для всего трафика, уходящего через внешний интерфейс
        oifname "ens33" masquerade
    }
}

# ============================================================
# ТАБЛИЦА ФИЛЬТРАЦИИ (IPv4 + IPv6)
# ============================================================
table inet filter {
    
    # Цепочка INPUT - пакеты, предназначенные САМОМУ маршрутизатору
    chain input {
        type filter hook input priority filter; policy drop;
        
        # Разрешить весь трафик на loopback интерфейсе
        iif "lo" accept
        
        # Разрешить установленные и связанные соединения
        ct state established,related accept
        
        # Отбросить невалидные пакеты (защита от спуфинга)
        ct state invalid drop
        
        # Разрешить ICMP (ping) - полезно для диагностики
        icmp type echo-request accept
        icmpv6 type echo-request accept
        
        # Разрешить SSH для управления маршрутизатором
        tcp dport 2221 accept

        # Разрешить DHCP (если маршрутизатор раздаёт IP через DHCP)
        udp dport 67 accept
        udp dport 68 accept
        
        # Разрешить DNS (если маршрутизатор является DNS-сервером)
        udp dport 53 accept
        tcp dport 53 accept
        
        # Разрешить HTTP/HTTPS для веб-интерфейса (Cockpit)
        tcp dport { 80, 443, 9090 } accept
        
        # Логировать и отбросить всё остальное
        log prefix "INPUT DROP: " level warn drop
    }
    
    # Цепочка FORWARD - пакеты, ПРОХОДЯЩИЕ ЧЕРЕЗ маршрутизатор
    chain forward {
        type filter hook forward priority filter; policy drop;
        
        # Разрешить установленные и связанные соединения (ответный трафик)
        ct state established,related accept
        
        # Отбросить невалидные пакеты
        ct state invalid drop
        
        # === РАЗРЕШЕНИЕ ПРОБРОШЕННЫХ СОЕДИНЕНИЙ ===
        # Разрешить проброшенный SSH к внутреннему серверу
        iifname "ens33" oifname "ens36" ip daddr 192.168.1.2 tcp dport 22 accept
        
        # Разрешить проброшенный HTTP (пример)
        # iifname "ens33" oifname "ens36" ip daddr 192.168.1.10 tcp dport 80 accept
        
        # === ОБЫЧНЫЙ ТРАФИК ===
        # Разрешить исходящий трафик из внутренней сети в интернет
        iifname "ens36" oifname "ens33" accept
        
        # Разрешить трафик между внутренними интерфейсами (если есть)
        # iifname "ens36" oifname "ens37" accept
        
        # Логировать и отбросить всё остальное
        log prefix "FORWARD DROP: " level warn drop
    }
    
    # Цепочка OUTPUT - пакеты, ИСХОДЯЩИЕ от самого маршрутизатора
    chain output {
        type filter hook output priority filter; policy accept;
        
        # Обычно policy accept для исходящего трафика
        # Можно добавить ограничения при необходимости
        
        # Пример: запретить исходящий трафик на определённый IP
        # ip daddr 1.2.3.4 drop
    }
}
