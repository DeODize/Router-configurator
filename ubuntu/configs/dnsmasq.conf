# Указываем dnsmasq слушать только интерфейс моста
interface=br0
bind-interfaces

# Отключаем чтение системных DNS, используем публичные
no-resolv
server=1.1.1.1
server=8.8.8.8

# Единый DHCP пул для всех устройств, подключенных к любому из 3 LAN портов
# Диапазон IP с 192.168.56.10 по 192.168.56.200, аренда на 12 часов
dhcp-range=192.168.56.10,192.168.56.200,255.255.255.0,12h

# Указываем шлюз по умолчанию (адрес самого роутера в мосту)
dhcp-option=3,192.168.56.1

# (Опционально) Передавать клиентам адрес самого dnsmasq как DNS сервер
# Это позволит dnsmasq кэшировать DNS запросы и ускорит работу сети
dhcp-option=6,192.168.56.1
